<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="36" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">Beyond Shape — Architecture (2026)</text>
  <text x="600" y="58" font-size="13" text-anchor="middle" fill="#475569">browser-centric monolith · client-side compute · default operating cost ≈ $1/month</text>

  <!-- VISITOR -->
  <rect x="40" y="120" width="180" height="120" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="130" y="150" font-size="14" font-weight="700" text-anchor="middle" fill="#166534">Visitor / Contributor</text>
  <text x="130" y="172" font-size="12" text-anchor="middle" fill="#334155">types text</text>
  <text x="130" y="190" font-size="12" text-anchor="middle" fill="#334155">shapes forms</text>
  <text x="130" y="208" font-size="12" text-anchor="middle" fill="#334155">reads forms back</text>

  <!-- WEB APP -->
  <rect x="270" y="80" width="640" height="560" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="590" y="106" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">THE WEB APP — static · client-side compute</text>
  <text x="590" y="123" font-size="12" text-anchor="middle" fill="#1d4ed8">Cloudflare Pages / Netlify / Vercel + CDN</text>

  <!-- Mode pills -->
  <rect x="300" y="138" width="120" height="28" rx="14" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="360" y="157" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">Generator</text>
  <rect x="445" y="138" width="120" height="28" rx="14" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="505" y="157" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">Collector</text>
  <rect x="590" y="138" width="120" height="28" rx="14" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="650" y="157" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">Explorer</text>

  <!-- Module 1: Interpretation -->
  <rect x="300" y="180" width="580" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="202" font-size="13" font-weight="700" fill="#065f46">1 · INTERPRETATION (on-device)</text>
  <text x="320" y="222" font-size="12" fill="#334155">continuous embedder → e (384-d) · no fixed taxonomy</text>
  <text x="320" y="240" font-size="12" fill="#334155">qualia head → q (16-d): material · light · motion · warmth</text>
  <text x="320" y="258" font-size="12" fill="#334155">VAD labels (steering only) · no server · no API key</text>

  <!-- Module 2: Generation -->
  <rect x="300" y="300" width="580" height="110" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="320" y="322" font-size="13" font-weight="700" fill="#4c1d95">2 · GENERATION (on-device)</text>
  <text x="320" y="342" font-size="12" fill="#334155">latent diffusion conditioned on [e, q]</text>
  <text x="320" y="360" font-size="12" fill="#334155">drift knob: consensus  ↔  hallucinated edge</text>
  <text x="320" y="378" font-size="12" fill="#334155">SDF blend → continuous form + material</text>
  <text x="320" y="396" font-size="12" fill="#334155">community drift via weekly LoRA fine-tune</text>

  <!-- Module 3: Rendering -->
  <rect x="300" y="430" width="580" height="90" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="320" y="452" font-size="13" font-weight="700" fill="#9a3412">3 · RENDERING (WebGPU)</text>
  <text x="320" y="472" font-size="12" fill="#334155">Three.js / Babylon · PBR materials · ACES tone mapping</text>
  <text x="320" y="490" font-size="12" fill="#334155">bloom · soft shadows · time / montage animation</text>

  <!-- Module 4: Context staging -->
  <rect x="300" y="540" width="580" height="80" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="320" y="562" font-size="13" font-weight="700" fill="#9d174d">4 · CONTEXT STAGING</text>
  <text x="320" y="582" font-size="12" fill="#334155">totem · strip (Kuleshov cut) · gallery (same form, different frames)</text>
  <text x="320" y="600" font-size="12" fill="#334155">context as a first-class, controllable variable</text>

  <!-- Internal module arrows -->
  <line x1="590" y1="282" x2="590" y2="298" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="590" y1="412" x2="590" y2="428" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="590" y1="522" x2="590" y2="538" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- CDN -->
  <rect x="950" y="80" width="210" height="130" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="1055" y="110" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">CDN — MODEL ASSETS</text>
  <text x="1055" y="132" font-size="12" text-anchor="middle" fill="#475569">embedder · generator</text>
  <text x="1055" y="150" font-size="12" text-anchor="middle" fill="#475569">· aligner (int8)</text>
  <text x="1055" y="168" font-size="12" text-anchor="middle" fill="#475569">versioned · immutable · cached</text>

  <!-- EDGE -->
  <rect x="270" y="680" width="640" height="90" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="590" y="706" font-size="14" font-weight="700" text-anchor="middle" fill="#854d0e">THIN SERVERLESS MONOLITH — one edge function</text>
  <text x="590" y="728" font-size="12" text-anchor="middle" fill="#713f12">consent-gated corpus writes · auth · rate limiting</text>
  <text x="590" y="746" font-size="12" text-anchor="middle" fill="#713f12">optional fallback: heavy inference for old devices</text>

  <!-- DB -->
  <rect x="40" y="700" width="180" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="130" y="726" font-size="14" font-weight="700" text-anchor="middle" fill="#7f1d1d">MANAGED DB</text>
  <text x="130" y="746" font-size="11" text-anchor="middle" fill="#7f1d1d">corpus of significations</text>
  <text x="130" y="766" font-size="11" text-anchor="middle" fill="#334155">Supabase / D1 / Turso</text>
  <text x="130" y="784" font-size="11" text-anchor="middle" fill="#334155">text · form params · consensus</text>
  <text x="130" y="800" font-size="11" text-anchor="middle" fill="#334155">(opted-in, consent-gated)</text>

  <!-- TRAINING -->
  <rect x="950" y="680" width="210" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1055" y="706" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">TRAINING — periodic</text>
  <text x="1055" y="728" font-size="12" text-anchor="middle" fill="#475569">Colab / Kaggle · weekly</text>
  <text x="1055" y="746" font-size="12" text-anchor="middle" fill="#475569">LoRA fine-tune</text>
  <text x="1055" y="764" font-size="12" text-anchor="middle" fill="#475569">aligner retrain</text>
  <text x="1055" y="786" font-size="12" text-anchor="middle" fill="#475569">→ publish model files</text>

  <!-- Arrows -->
  <!-- Visitor <-> App -->
  <line x1="222" y1="180" x2="266" y2="180" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="244" y="170" font-size="10" text-anchor="middle" fill="#475569">text in /</text>
  <text x="244" y="198" font-size="10" text-anchor="middle" fill="#475569">form out</text>

  <!-- App <-> CDN -->
  <line x1="912" y1="130" x2="946" y2="130" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="929" y="120" font-size="10" text-anchor="middle" fill="#475569">pull / publish</text>
  <text x="929" y="148" font-size="10" text-anchor="middle" fill="#475569">model files</text>

  <!-- App -> Edge -->
  <line x1="590" y1="642" x2="590" y2="676" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="663" font-size="11" fill="#475569">consent-gated writes</text>

  <!-- Edge -> DB -->
  <line x1="268" y1="730" x2="224" y2="730" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Training -> CDN -->
  <line x1="1055" y1="678" x2="1055" y2="214" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1068" y="450" font-size="11" fill="#475569">publish model files (weekly)</text>

  <!-- DB -> Training (dashed) -->
  <path d="M130,812 L130,852 L1055,852 L1055,814" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="592" y="844" font-size="11" text-anchor="middle" fill="#475569">corpus pull (weekly)</text>

  <!-- Cost note -->
  <rect x="270" y="825" width="640" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="590" y="853" font-size="13" text-anchor="middle" fill="#334155">Default operating cost ≈ $1/month (domain) — hosting, DB, inference and training all on free tiers</text>
</svg>
